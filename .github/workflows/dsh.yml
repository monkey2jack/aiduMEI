name: DSH preview

on:
  pull_request:
  push:
    branches: [main, 'f08pp/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HERMES_SRC: 'off'
      DSH_SMOKE_SESSIONS: '1'
      DSH_SMOKE_TURNS: '3'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the fixed DSH host and Python MCP dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --save-exact @deepseek-ai/dsh@0.2.2-rc.3 pnpm@11.28.5
          python - <<'PY'
          import os, pathlib, sys
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dsh-runtime' / 'node_modules'
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(runtime / '.bin') + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('DSH_CLI_ENTRY=' + str(runtime / '@deepseek-ai/dsh/lib/bin.js') + '\n')
              f.write('DSH_MCP_PYTHON=' + sys.executable + '\n')
              f.write('AIDUMEM_ENV_FILE=' + os.devnull + '\n')
          PY
      - name: Adapter behavior and native filesystem boundaries
        run: node --test integrations/dsh/test/*.test.mjs
      - name: DSH launcher credential isolation
        run: python -m pytest tests/test_f08pp_dsh_launcher.py -q
      - name: Actual DSH lifecycle, MCP recall, install, check and uninstall
        run: node integrations/dsh/test/host-smoke.mjs
      - name: Preserve synthetic host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.os }}
          path: ${{ runner.temp }}/aidumei-dsh-host-*/report.json
          if-no-files-found: ignore

  cc-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_SRC: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Existing CC and Codex files match the reviewed baseline
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          baseline = json.loads(pathlib.Path('integrations/dsh/cc-baseline.json').read_text())
          additive = baseline.get('additive_sha256', {})
          protected = {name: expected for name, expected in baseline['sha256'].items() if name not in additive}
          mismatches = [name for name, expected in protected.items()
                        if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected]
          mismatches += [name for name, expected in additive.items()
                         if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected]
          assert not mismatches, 'Protected integration changed: ' + ', '.join(mismatches)
          print('CC/Codex files unchanged:', len(protected), '; reviewed additive MCP opt-ins:', len(additive))
          PY
      - name: Existing CC, bridge, host and MCP regression tests
        run: |
          python -m pytest -q \
            tests/test_f04pp_cc_adaptation.py tests/test_f08_connect_host_claude.py \
            tests/test_f07_p3_connect_host.py tests/test_f07_mcp_auto_memory.py \
            tests/test_f08plus_cc_client.py tests/test_f08_cc_memory_bridge.py \
            tests/test_f08_cc_memory_sweep.py tests/test_f08_cc_bridge_connect.py \
            tests/test_f0_2_session_distill_fallback.py tests/test_f0_2_session_distill_ordering.py

# aiduMEI 测试流水线（v20 · P2-1）
#
# 为什么这个文件必须存在
# ──────────────────────
# k3 高-2 ＝ fable5 H2，两份独立审计罕见地完全同调：本仓 78 个测试文件、上千条
# 断言、一整套「反假绿灯」方法论 —— **一条都没在 CI 里跑过**。
# `.github/workflows/` 从前只有 `docker.yml`，全 `.github/` 搜 `pytest` = 0 命中。
# 也就是说：**一个没跑过测试的提交，可以直接变成 `latest` 镜像。**
#
# 这个仓最大的资产是测试纪律，而那份纪律此前完全依赖人肉执行。执行人状态一波动，
# 防线整体失效 —— 这不是假设，这是本仓 CHANGELOG 里已经记过的翻车模式。
#
# 两个设计选择
# ──────────
# 1. 本工作流保留为**可复用工作流**和手动触发；不再随 main 推送自动运行，
#    避免对外分发面收缩后继续产生 Actions 邮件噪音。
# 2. `HERMES_SRC: "off"` 显式关掉宿主自动发现：让跳过行为**双向可复现**。
#    不写这一句，CI 机器上有没有宿主源码就成了一个隐式变量，跳过条数飘忽不定，
#    而 README 里那几个数字是按轴对得上号的。
name: Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    env:
      # 宿主自动发现显式关掉 —— 见文件头第 2 条
      HERMES_SRC: "off"
      # 数据目录隔离：conftest.py 本就会重定向，这里再加一道，
      # 保证任何绕过 conftest 的子进程也落不到仓库 data/ 里
      # `runner.temp` is only available in step expressions, not job-level env.
      # Use the hosted runner's disposable /tmp area directly so the workflow
      # parses before any job is created.
      AIDUMEM_DATA_DIR: /tmp/aidumei-ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Pytest
        run: pytest tests/ -q -rs

      - name: 跳过项必须可解释
        # 跳过不是「差不多绿了」。这一步把跳过条数打出来，让每次运行的跳过面
        # 都留在日志里 —— 哪天某条轴悄悄多吃掉几十条用例，翻日志就能看见。
        if: always()
        run: pytest tests/ -q -rs 2>&1 | tail -20

  # ── 新用户入门路径冒烟（v20.2.3 · 外审 H-1）──────────────────────────
  # 上面那个 job 装完 requirements 还会补跑 `pip install -e .`，于是按
  # pyproject 把依赖拉齐了 —— 恰好**遮蔽**了 requirements.txt 自身的缺口。
  # README「30 秒上手 · 方式一」教新用户只跑 requirements.txt，那条路径
  # 因此从未被 CI 走过：python-multipart 漏了半个版本没人发现，
  # 而它缺席时 `import api_server` 直接 RuntimeError（服务起不来）。
  # 这个 job 只做一件事：**照 README 的原话走一遍**。
  bare-requirements-smoke:
    runs-on: ubuntu-latest
    env:
      AIDUMEM_DATA_DIR: /tmp/aidumei-bare-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install（只装 requirements.txt，绝不补 pip install .）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 反证——本 job 必须真的没装包内依赖
        # 若哪天有人在上面偷偷加了 `pip install .`，这一步会让本 job 失去
        # 意义却仍然全绿。断言「本包未被安装」，把这个 job 的前提焊死。
        run: |
          if pip show aidumei > /dev/null 2>&1; then
            echo "❌ aidumei 已被安装 —— 本 job 的前提被破坏，它不再检验裸装路径"
            exit 1
          fi
          echo "✅ 前提成立：仅 requirements.txt，包本体未安装"
      - name: README 原文路径——import api_server 必须成功
        run: python -c "import api_server; print('✅ 裸装路径可 import')"

  # ── v20.2.4（外审 F-21）：可选依赖组装得上、工具起不来 ──────────────
  # `mcp` 此前没有上限，pip 解析到 2.x，而 mcp_server.py 导入的
  # `mcp.server.fastmcp` 在 2.x 里不存在。`pip install 'aidumei[mcp]'` 全绿，
  # 用户拿到的是一个 import 就炸的工具集。**装得上 ≠ 用得了。**
  mcp-extra-import:
    runs-on: ubuntu-latest
    env:
      AIDUMEM_DATA_DIR: /tmp/aidumei-mcp-extra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 按用户会打的那条命令装
        run: |
          python -m pip install --upgrade pip
          pip install '.[mcp]'
      - name: 前提反证——mcp 必须真的装进来了
        # 若 extra 名字写错或被静默跳过，下一步的 import 可能因为别的原因通过，
        # 而这个 job 就变成了一个不检验任何东西的绿灯。
        run: |
          python - <<'PY'
          import importlib.metadata as md
          v = md.version("mcp")
          major = int(v.split(".")[0])
          assert major < 2, f"解析到 mcp {v} —— <2 的上限没生效"
          print(f"✅ 前提成立：mcp {v}")
          PY
      - name: 工具集必须能导入
        run: python -c "import mcp_server; print('✅ mcp_server 导入成功')"

  # ── v20.2.4（外审 F-26）：wheel 里没有 UI 与集成资产 ────────────────
  # packages.find 只发现 ducky*/benchmarks*，而 MANIFEST.in 的
  # recursive-include 只影响 sdist。于是 `pip install aidumei` 之后入口点在、
  # /ui 是空的、首次运行找不到配置样例。CHANGELOG 宣称过这些随包发布 ——
  # **宣称即承诺，那就得有一条真装一遍的验收。**
  wheel-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist_ci
      - name: 前提反证——只有一个 wheel，且版本号与 version.py 一致
        run: |
          python - <<'PY'
          import glob, re
          whls = glob.glob("dist_ci/*.whl")
          assert len(whls) == 1, f"期望恰好 1 个 wheel，实得 {whls}"
          src = open("ducky/version.py", encoding="utf-8").read()
          ver = re.search(r'SERVICE_VERSION\s*=\s*"([^"]+)"', src).group(1)
          assert ver in whls[0], f"wheel {whls[0]} 与 SERVICE_VERSION {ver} 不一致"
          print(f"✅ 前提成立：{whls[0]}（{ver}）")
          PY
      - name: 装进干净环境，逐项断言宣称的资产在场
        run: |
          python -m venv /tmp/wenv
          /tmp/wenv/bin/pip install --quiet dist_ci/*.whl
          /tmp/wenv/bin/python - <<'PY'
          import pathlib, sysconfig
          site = pathlib.Path(sysconfig.get_paths()["purelib"])
          missing = []
          for rel in ("frontend", "integrations", "deploy",
                      "mem0_config_local.json.example", ".env.example"):
              if not (site / rel).exists():
                  missing.append(rel)
          assert not missing, f"wheel 缺少宣称随包发布的资产：{missing}"
          n = len(list((site / "frontend").rglob("*")))
          assert n >= 5, f"frontend 只有 {n} 项，像是空目录占位"
          print(f"✅ 资产齐备（frontend {n} 项）")
          PY

  # ── v20.2.4（外审 F-02）：镜像层里的密钥 ────────────────────────────
  # `.gitignore` 只保护 Git，不保护 Docker build context。Dockerfile 的
  # `COPY . /app` 会把上下文里的 .env / *.key 复制进镜像层 —— 即使容器以
  # 非 root 运行，能拉取镜像的人仍然读得到那一层。
  docker-context-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .dockerignore 必须排除密钥与本地配置
        run: |
          python - <<'PY'
          import pathlib
          ign = pathlib.Path(".dockerignore").read_text(encoding="utf-8")
          need = [".env", ".llm_key", ".sf_key", ".sensenova_key",
                  "mem0_config_local.json", "*.pem", "*.key"]
          missing = [n for n in need if n not in ign]
          assert not missing, f".dockerignore 未排除：{missing}"
          assert ".env.example" in ign, "样例文件必须显式保留（负向：别把它一起排除了）"
          print("✅ 排除项齐备，且样例文件保留")
          PY
      - name: 造一个假密钥，证明它进不了构建上下文
        # 前提反证：不是只读 .dockerignore 的文本，而是让 docker 自己说话。
        run: |
          printf 'AIDUMEM_API_TOKEN=ci-fake-not-a-real-secret\n' > .env
          printf 'ci-fake-llm-key\n' > .llm_key
          docker build -t aidumei-ctx-probe -f Dockerfile . --target builder 2>/dev/null \
            || docker build -t aidumei-ctx-probe -f Dockerfile .
          leaked=$(docker run --rm --entrypoint sh aidumei-ctx-probe -c \
            'ls -a /app 2>/dev/null | grep -cE "^\.env$|^\.llm_key$"' || echo 0)
          rm -f .env .llm_key
          if [ "$leaked" != "0" ]; then
            echo "❌ 镜像层里找到了 $leaked 个密钥文件"
            exit 1
          fi
          echo "✅ 假密钥未进入镜像"

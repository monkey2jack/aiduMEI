[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidumei"
version = "20.2.4"
description = "aiduMEI: self-hosted multi-tier AI wisdom engine — active Reflect, memory self-editing & recursive refinement, auto skill growth, persona memory layer, native MemoryProvider bridge, FTS5 & Qdrant recall, multimodal vision & Obsidian bi-directional links"
readme = "README.md"
authors = [
    { name = "aiduMEI Team" }
]
license = { text = "MIT" }
# P2-1：README 声明支持 3.10-3.12，此前未声明 requires-python，
# pip 不会拦住 3.9 用户（代码里大量 `X | None` 语法在 3.9 上直接 SyntaxError）。
requires-python = ">=3.10"
keywords = ["memory", "mem0", "hermes", "hermes-agent", "aiduMEI", "ai", "rag", "qdrant", "fts5", "memory-provider", "obsidian", "multimodal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# P2-1（v19.4.1）：与 requirements.txt 的实锁对齐。
# 此前 pyproject 是松范围（fastapi>=0.100.0）而 requirements 是精确锁
# （==0.136.3），`pip install aidumei` 的用户与克隆源码的用户跑在两套
# 依赖树上 —— 前者可能装到 2023 年的 fastapi，行为与我们测过的完全不同。
# 现在下限对齐实锁的主版本，上限拦住已知不兼容的下一个大版本。
dependencies = [
    "mem0ai==2.0.19",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "qdrant-client>=1.15,<2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local-embed = ["fastembed>=0.8"]
# v20.2.4（外审 F-21）：钉 <2 —— 上限缺失时 pip 解析到 mcp 2.x，
# 而 mcp_server.py 导入的 `mcp.server.fastmcp` 在 2.x 里不存在，
# 于是 `pip install 'aidumei[mcp]'` 装得上、工具起不来。
# v2 迁移另立项，不在维护版里跨大版本。
mcp = ["mcp>=1.0.0,<2"]
# sync: mem0_sync.py 守护模式（inotify 监听 MEMORY.md）。仅 Linux 有 inotify。
# v19.4.2 补：此前该依赖从未在任何清单里声明，照仓库部署 sync 必然崩溃循环。
sync = ["inotify_simple>=1.3.5; sys_platform == 'linux'"]
full = [
    "mcp>=1.0.0,<2",   # v20.2.4 F-21：同上，2.x 的 fastmcp 路径已变
    "inotify_simple>=1.3.5; sys_platform == 'linux'",
]

# dev: 跑测试用。requirements-dev.txt 是这一组的镜像，两边必须同步
#（tests/test_v20_dev_deps_declaration.py 盯着）。
# pytest 下限 7：subTest 失败在 7 和 9 上都会红，只是 9 起才逐条报
# （subtests 是 pytest 9 的内置插件，不是第三方依赖 —— 别再往清单里加）。
dev = ["pytest>=7.0.0", "pyyaml>=6.0"]

# bench: 跑分管线用。三个都曾经**一处未声明**，靠「本机碰巧装过」才跑得通 ——
# 与 v19.4.2 的 inotify_simple 是同一个形态：声明的一半指着空气，
# 换一台干净机器就现原形（v20 实机实测：nltk 缺失 → 13 条用例集体变红，
# 而那些红看着和真缺陷一模一样）。
#   · nltk  —— LoCoMo 官方 F1 的 PorterStemmer，换实现就不是官方口径了
#   · regex —— 官方归一化用的 \p{...} 类，标准库 re 不支持
#   · numpy —— 多答案 F1 求均值时的对拍基准
bench = ["nltk>=3.8", "regex>=2023.0.0", "numpy>=1.24"]

[project.scripts]
aidumem = "api_server:main"
aidumei = "api_server:main"
aidumem-mcp = "mcp_server:main"
aidumei-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ducky*", "benchmarks*"]

# 评测管线随包发布（CHANGELOG 宣称 v20.0 新增 benchmarks/，宣称即承诺）；
# smoke fixture 与协议文档是管线可复现性的一部分，必须进 wheel。
[tool.setuptools.package-data]
benchmarks = ["fixtures/*.json", "*.md"]
# v20.2.4（外审 F-26）：UI / 集成 / 部署资产此前**不进 wheel** ——
# packages.find 只发现 ducky* 与 benchmarks*，而 MANIFEST.in 的
# recursive-include 只影响 sdist。于是 `pip install aidumei` 之后入口点在、
# /ui 却是空的，首次运行也找不到配置样例。
#
# 做法：把它们作为 ducky 的 package-data 随包发布（ducky/ 是唯一确定进 wheel
# 的包），并在 CI 里加一条「安装 wheel 后这些文件必须存在」的验收。
ducky = [
    "../frontend/**/*",
    "../integrations/**/*",
    "../deploy/**/*",
    "../mem0_config_local.json.example",
    "../.env.example",
]

# 显式声明根目录顶层单文件模块，setuptools 才能把它打进 wheel 根目录，
# 否则 pip install 之后 import api_server 会 ModuleNotFoundError，
# /usr/local/bin/aidumem 入口点找不到 api_server。
[tool.setuptools]
py-modules = ["api_server", "mcp_server", "mem0_sync"]

# 生产机采用保留式备份与并行候选目录；pytest 不应把这些运行期副本当成第二份
# 测试套件收集，否则同名 test_*.py 会 import mismatch，或把备份里的旧代码当成
# 当前产品扫描。真正的源码范围仍由各守卫自己的射程地板负责。
[tool.pytest.ini_options]
norecursedirs = [".*", "venv*", "backups", ".upgrade-artifacts", "data", "logs", "build", "dist"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidumem"
version = "17.0.0"
description = "aiduMEM: self-hosted multi-tier memory for Hermes Agent — native MemoryProvider bridge, CoreMemory, FTS5 & Qdrant recall"
readme = "README.md"
authors = [
    { name = "Jack & Dudu (aiduHER)", email = "iamjw9@gmail.com" }
]
license = { text = "MIT" }
keywords = ["memory", "mem0", "hermes", "hermes-agent", "aiduMEM", "ai", "rag", "qdrant", "fts5", "memory-provider"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mem0ai>=2.0.15",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.7.0",
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://github.com/monkey2jack/aiduMEM"
Documentation = "https://github.com/monkey2jack/aiduMEM#readme"
Repository = "https://github.com/monkey2jack/aiduMEM.git"

[project.scripts]
aidumem = "api_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ducky*", "scripts*"]

# 服务入口是仓库根的单文件模块，不在 ducky/ 包里。不显式声明的话
# wheel 只装 ducky/ + scripts/，而 [project.scripts] 的 aidumem 指向
# api_server:main —— 装完一执行就 ModuleNotFoundError: api_server。
# v15 之前的 wheel 就是这个状态（入口点从来没跑起来过）。
[tool.setuptools]
py-modules = ["api_server", "mcp_server", "mem0_sync"]

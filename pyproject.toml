[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidumei"
version = "19.3.0"
description = "aiduMEI: self-hosted multi-tier AI wisdom engine — active Reflect, memory self-editing & recursive refinement, auto skill growth, persona memory layer, native MemoryProvider bridge, FTS5 & Qdrant recall, multimodal vision & Obsidian bi-directional links"
readme = "README.md"
authors = [
    { name = "aiduMEI Team" }
]
license = { text = "MIT" }
keywords = ["memory", "mem0", "hermes", "hermes-agent", "aiduMEI", "ai", "rag", "qdrant", "fts5", "memory-provider", "obsidian", "multimodal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mem0ai==2.0.18",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0",
    "qdrant-client>=1.7.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
full = [
    "mcp>=1.0.0",
]

[project.scripts]
aidumem = "api_server:main"
aidumei = "api_server:main"
aidumem-mcp = "mcp_server:main"
aidumei-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ducky*"]

# 显式声明根目录顶层单文件模块，setuptools 才能把它打进 wheel 根目录，
# 否则 pip install 之后 import api_server 会 ModuleNotFoundError，
# /usr/local/bin/aidumem 入口点找不到 api_server。
[tool.setuptools]
py-modules = ["api_server", "mcp_server", "mem0_sync"]
